{% extends "base.html" %}
{% block title %}综合排名{% endblock %}

{% block content %}
<section class="py-8">
    <div class="max-w-7xl mx-auto px-4">
        <h1 id="pageTitle" class="text-3xl font-bold mb-2">🏆 综合排名</h1>
        <p id="pageDesc" class="text-gray-500 dark:text-gray-400 mb-8">基于学生真实测评的综合排名，拖动滑块调整各维度权重</p>

        <!-- 权重调整 -->
        <div id="weightPanel" class="bg-white dark:bg-gray-800 rounded-xl p-6 border border-gray-200 dark:border-gray-700 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-bold text-lg">⚖️ 权重调整</h2>
                <button onclick="resetWeights()" class="text-sm text-primary-600 dark:text-primary-400 hover:underline">重置为默认</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
                {% for k in cat_keys %}
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-sm flex items-center space-x-1">
                            <span>{{ categories[k].icon }}</span>
                            <span>{{ categories[k].name }}</span>
                        </label>
                        <span id="wval_{{ k }}" class="text-sm font-medium text-primary-600 dark:text-primary-400">{{ categories[k].weight }}</span>
                    </div>
                    <input type="range" id="w_{{ k }}" data-key="{{ k }}" min="0" max="30" value="{{ categories[k].weight }}" step="1"
                           class="w-full slider-track bg-gray-200 dark:bg-gray-600 cursor-pointer"
                           oninput="updateWeight(this)">
                </div>
                {% endfor %}
            </div>
            <div class="mt-4 text-center">
                <button onclick="loadRanking()" class="px-6 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-lg font-medium transition-colors">
                    🔄 更新排名
                </button>
            </div>
        </div>

        <!-- 筛选 -->
        <div class="bg-white dark:bg-gray-800 rounded-xl p-4 border border-gray-200 dark:border-gray-700 mb-6">
            <div class="flex flex-wrap items-center gap-4">
                <div>
                    <label class="text-sm text-gray-500 mr-2">省份</label>
                    <input type="text" id="filterProvince" placeholder="如：广东" 
                           class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm w-32">
                </div>
                <div>
                    <label class="text-sm text-gray-500 mr-2">城市</label>
                    <input type="text" id="filterCity" placeholder="如：广州"
                           class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-sm w-32">
                </div>
                <button onclick="loadRanking()" class="px-4 py-1.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm font-medium transition-colors">
                    筛选
                </button>
                <!-- 单项排名时显示"返回综合排名" -->
                <a id="backToOverall" href="/ranking" class="hidden px-4 py-1.5 border border-primary-300 dark:border-primary-600 rounded-lg text-sm text-primary-600 dark:text-primary-400 hover:bg-primary-50 dark:hover:bg-primary-900/20 transition-colors">
                    ← 返回综合排名
                </a>
            </div>
        </div>

        <!-- 排名表格 -->
        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-50 dark:bg-gray-700 border-b border-gray-200 dark:border-gray-600">
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 dark:text-gray-400 w-16">排名</th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 dark:text-gray-400">学校</th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 dark:text-gray-400 hidden md:table-cell">地区</th>
                            <th id="thScore" class="px-4 py-3 text-center text-sm font-medium text-gray-500 dark:text-gray-400">综合分</th>
                            <th class="px-4 py-3 text-center text-sm font-medium text-gray-500 dark:text-gray-400 hidden lg:table-cell">测评数</th>
                            {% for k in cat_keys %}
                            <th class="px-3 py-3 text-center text-sm font-medium text-gray-500 dark:text-gray-400 hidden xl:table-cell">{{ categories[k].icon }}</th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody id="rankingBody">
                        <tr><td colspan="{{ 5 + cat_keys|length }}" class="px-4 py-12 text-center text-gray-400">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<script>
const catKeys = {{ cat_keys | tojson }};
const catInfo = {{ categories | tojson }};
const urlParams = new URLSearchParams(window.location.search);
const singleCat = urlParams.get('cat');

// 单项排名模式：隐藏权重面板，设置标题
if (singleCat && catInfo[singleCat]) {
    document.getElementById('pageTitle').textContent = catInfo[singleCat].icon + ' ' + catInfo[singleCat].name + ' 排名';
    document.getElementById('pageDesc').textContent = '按「' + catInfo[singleCat].name + '」维度从高到低排名';
    document.getElementById('weightPanel').classList.add('hidden');
    document.getElementById('backToOverall').classList.remove('hidden');
    document.title = catInfo[singleCat].name + '排名 - 学之声';
    // 表头改为单项分
    document.getElementById('thScore').textContent = catInfo[singleCat].name;
}

function formatScore(score) {
    const s = parseFloat(score);
    if (isNaN(s)) return '0.0';
    return s.toFixed(1);
}

function updateWeight(el) {
    document.getElementById('wval_' + el.dataset.key).textContent = el.value;
}

function resetWeights() {
    {% for k in cat_keys %}
    document.getElementById('w_{{ k }}').value = {{ categories[k].weight }};
    document.getElementById('wval_{{ k }}').textContent = {{ categories[k].weight }};
    {% endfor %}
    loadRanking();
}

async function loadRanking() {
    const params = new URLSearchParams();

    if (singleCat && catInfo[singleCat]) {
        // 单项排名：该维度权重30，其他0
        for (const k of catKeys) {
            params.append('w_' + k, k === singleCat ? '30' : '0');
        }
    } else {
        {% for k in cat_keys %}
        params.append('w_{{ k }}', document.getElementById('w_{{ k }}').value);
        {% endfor %}
    }
    const province = document.getElementById('filterProvince').value.trim();
    const city = document.getElementById('filterCity').value.trim();
    if (province) params.append('province', province);
    if (city) params.append('city', city);

    const resp = await fetch('/api/ranking?' + params.toString());
    const data = await resp.json();

    const tbody = document.getElementById('rankingBody');
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="{{ 5 + cat_keys|length }}" class="px-4 py-12 text-center text-gray-400">暂无数据</td></tr>';
        return;
    }

    // 单项排名按该维度分排序，综合排名按overall排序（API已排序）
    if (singleCat) {
        data.sort((a, b) => (b['avg_' + singleCat] || 0) - (a['avg_' + singleCat] || 0));
        // 重新排名
        data.forEach((r, i) => r.rank = i + 1);
    }

    tbody.innerHTML = data.map(r => {
        const rankBadge = r.rank <= 3
            ? `<span class="inline-flex items-center justify-center w-8 h-8 rounded-full ${r.rank === 1 ? 'bg-yellow-100 text-yellow-700' : r.rank === 2 ? 'bg-gray-100 text-gray-600' : 'bg-orange-100 text-orange-700'} font-bold text-sm">${r.rank}</span>`
            : `<span class="text-gray-500">${r.rank}</span>`;

        const displayScore = singleCat ? (r['avg_' + singleCat] || 0) : r.overall_score;
        const scoreClass = displayScore >= 4 ? 'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400'
            : displayScore >= 3 ? 'bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400'
            : displayScore >= 2 ? 'bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-400'
            : 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400';

        let catCells = catKeys.map(k => {
            const val = formatScore(r['avg_' + k]) || '-';
            const highlight = (singleCat === k) ? 'font-bold text-primary-600 dark:text-primary-400' : '';
            return `<td class="px-3 py-3 text-center text-sm hidden xl:table-cell ${highlight}">${val}/5</td>`;
        }).join('');

        return `<tr class="border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
            <td class="px-4 py-3">${rankBadge}</td>
            <td class="px-4 py-3"><a href="/school/${r.school_id}" class="font-medium hover:text-primary-600 dark:hover:text-primary-400">${r.school_name}</a>
                ${r.level ? `<span class="ml-1 px-1.5 py-0.5 text-xs rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400">${r.level}</span>` : ''}
            </td>
            <td class="px-4 py-3 text-sm text-gray-500 hidden md:table-cell">${r.province || ''} ${r.city || ''}</td>
            <td class="px-4 py-3 text-center"><span class="px-3 py-1 rounded-lg font-bold ${scoreClass}">${formatScore(displayScore)}/5</span></td>
            <td class="px-4 py-3 text-center text-sm text-gray-500 hidden lg:table-cell">${r.review_count}</td>
            ${catCells}
        </tr>`;
    }).join('');
}

// 初始加载
loadRanking();
</script>
{% endblock %}
