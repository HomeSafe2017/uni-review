<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}大学专业测评{% endblock %} - 学之声</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' },
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; }
        .slider-track { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; outline: none; }
        .slider-track::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #4f46e5; cursor: pointer; box-shadow: 0 2px 6px rgba(79,70,229,0.4); }
        .dark .slider-track::-webkit-slider-thumb { background: #818cf8; }
        .tag-chip { transition: all 0.15s; }
        .tag-chip:hover { transform: translateY(-1px); }
        .tag-chip.selected { background: #4f46e5; color: white; }
        .dark .tag-chip.selected { background: #818cf8; }
        .card-hover { transition: all 0.2s; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .dark .card-hover:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .star-display { color: #f59e0b; }
        .gradient-text { background: linear-gradient(135deg, #4f46e5, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-bg { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #a855f7 100%); }
        .glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .search-glow:focus { box-shadow: 0 0 0 3px rgba(99,102,241,0.3); }
        /* 自定义滚动条 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">

<!-- 导航栏 -->
<nav class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <a href="/" class="flex items-center space-x-2">
                <span class="text-2xl">🎓</span>
                <span class="text-xl font-bold gradient-text">学之声</span>
                <span class="text-xs text-gray-400 hidden sm:inline">学生视角的真实测评</span>
            </a>
            <!-- 桌面导航 -->
            <div class="hidden md:flex items-center space-x-1">
                <a href="/" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">首页</a>
                <a href="/ranking" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">排名</a>
                <a href="/compare" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">对比</a>
                <a href="/submit" class="ml-2 px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm font-medium transition-colors">写测评</a>
            </div>
            <div class="flex items-center space-x-2">
                <!-- 暗色模式切换 -->
                <button onclick="toggleDark()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="切换主题">
                    <span id="theme-icon" class="text-xl">🌙</span>
                </button>
                <!-- 移动端菜单 -->
                <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </div>
    </div>
    <!-- 移动端菜单 -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
        <div class="px-4 py-3 space-y-2">
            <a href="/" class="block px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">首页</a>
            <a href="/ranking" class="block px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">排名</a>
            <a href="/compare" class="block px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">对比</a>
            <a href="/submit" class="block px-3 py-2 rounded-lg bg-primary-600 text-white text-center">写测评</a>
        </div>
    </div>
</nav>

<!-- 主内容 -->
<main class="flex-1">
    {% block content %}{% endblock %}
</main>

<!-- 页脚 -->
<footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-12">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🎓</span>
                <span class="font-bold gradient-text">学之声</span>
                <span class="text-sm text-gray-500">站在学生的角度，说出真实的声音</span>
            </div>
            <div class="flex flex-col items-center md:items-end space-y-2">
                <div class="flex items-center space-x-2 text-sm">
                    <span class="text-gray-400">友情链接：</span>
                    <a href="https://agentkey.app" target="_blank" rel="noopener noreferrer"
                       class="text-primary-600 hover:text-primary-700 dark:text-primary-400 dark:hover:text-primary-300 font-medium hover:underline">
                        Agentkey ↗
                    </a>
                </div>
                <div class="text-xs text-gray-400 text-center md:text-right leading-relaxed">
                    本测评网站受到 <a href="https://agentkey.app" target="_blank" rel="noopener noreferrer" class="text-primary-500 hover:underline">Agentkey</a> 项目大力支持<br>
                    「让你的 Agent 能获得最真实信息的 Agentkey」
                </div>
                <div class="text-sm text-gray-400">
                    © 2026 学之声 - 大学专业综合测评平台
                </div>
            </div>
        </div>
    </div>
</footer>

<script>
// ── 暗色模式 ──
function toggleDark() {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
}
(function() {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').textContent = '☀️';
    }
})();

// ── 移动端菜单 ──
function toggleMobileMenu() {
    document.getElementById('mobile-menu').classList.toggle('hidden');
}

// ── 设备指纹 ──
function getDeviceId() {
    let id = localStorage.getItem('device_id');
    if (!id) {
        // crypto.randomUUID() 在HTTP非安全上下文下不可用，降级为Math.random
        try {
            id = 'dev_' + crypto.randomUUID();
        } catch (e) {
            id = 'dev_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
        }
        localStorage.setItem('device_id', id);
    }
    return id;
}

// ── 通用工具 ──
function scoreColor(score) {
    if (score >= 4) return 'text-green-500';
    if (score >= 3) return 'text-yellow-500';
    if (score >= 2) return 'text-orange-500';
    return 'text-red-500';
}

function scoreBg(score) {
    if (score >= 4) return 'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400';
    if (score >= 3) return 'bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400';
    if (score >= 2) return 'bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-400';
    return 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400';
}

function stars(score) {
    const full = Math.floor(score);
    const half = score - full >= 0.5;
    let s = '';
    for (let i = 0; i < full; i++) s += '★';
    if (half) s += '☆';
    return `<span class="star-display">${s}</span>`;
}

function timeAgo(dateStr) {
    const now = new Date();
    const date = new Date(dateStr + 'Z');
    const diff = Math.floor((now - date) / 1000);
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
    if (diff < 2592000) return Math.floor(diff / 86400) + '天前';
    return dateStr.split(' ')[0];
}

// ── 点赞 ──
async function toggleLike(type, id, btn) {
    const deviceId = getDeviceId();
    const resp = await fetch('/api/like', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ device_id: deviceId, target_type: type, target_id: id })
    });
    const data = await resp.json();
    if (data.success) {
        const countEl = btn.querySelector('.like-count');
        const iconEl = btn.querySelector('.like-icon');
        let count = parseInt(countEl.textContent || '0');
        if (data.liked) {
            countEl.textContent = count + 1;
            iconEl.textContent = '❤️';
        } else {
            countEl.textContent = Math.max(0, count - 1);
            iconEl.textContent = '🤍';
        }
    }
}
</script>
</body>
</html>
